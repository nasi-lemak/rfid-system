server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # SPA routing
  location / { try_files $uri /index.html; }
  # Same-origin API + SignalR proxy so the browser needs no CORS
  location /api/ { proxy_pass http://api:8080/api/; proxy_set_header Host $host; }
  location /swagger { proxy_pass http://api:8080/swagger; }
  location /hubs/ {
    proxy_pass http://api:8080/hubs/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
}
