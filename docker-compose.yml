services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rfid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    ports: [ "5432:5432" ]
    healthcheck: { test: [ "CMD-SHELL", "pg_isready -U postgres" ], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]

  # Scale out with `docker compose up --scale api=3` (leases coordinate jobs/readers; Redis fans out live updates).
  api:
    build: ./src/backend
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    environment:
      ConnectionStrings__Default: "Host=db;Database=rfid;Username=postgres;Password=postgres"
      Redis__ConnectionString: "redis:6379"
      Warehouse__Path: "/warehouse"
    volumes: [ "warehouse:/warehouse" ]
      Jwt__Key: "${JWT_KEY:-change-me-in-production-this-key-must-be-at-least-32-bytes}"
      Cors__Origins__0: "http://localhost:8080"
      Cors__Origins__1: "http://localhost:5173"
      Seed__AdminEmail: "${ADMIN_EMAIL:-admin@demo.local}"
      Seed__AdminPassword: "${ADMIN_PASSWORD:-admin123}"
    ports: [ "5080:8080" ]

  web:
    build: ./src/web
    depends_on: [ api ]
    ports: [ "8080:80" ]

volumes:
  pgdata:
  warehouse:
