services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rfid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:-rfid_app}"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./deploy/db-init:/docker-entrypoint-initdb.d:ro"   # creates the restricted rfid_app runtime role
    ports: [ "5432:5432" ]
    healthcheck: { test: [ "CMD-SHELL", "pg_isready -U postgres" ], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]

  # Scale out with `docker compose up --scale api=3` (leases coordinate jobs/readers; Redis fans out live updates).
  api:
    build: ./src/backend
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    environment:
      # Runtime connection: non-owner role so Postgres row-level security applies to every tenant table.
      ConnectionStrings__Default: "Host=db;Database=rfid;Username=rfid_app;Password=${APP_DB_PASSWORD:-rfid_app}"
      # Migrations/DDL run as the owner at startup.
      ConnectionStrings__Migrations: "Host=db;Database=rfid;Username=postgres;Password=postgres"
      Redis__ConnectionString: "redis:6379"
      Warehouse__Path: "/warehouse"
      Jwt__Key: "${JWT_KEY:-change-me-in-production-this-key-must-be-at-least-32-bytes}"
      Cors__Origins__0: "http://localhost:8080"
      Cors__Origins__1: "http://localhost:5173"
      Seed__AdminEmail: "${ADMIN_EMAIL:-admin@demo.local}"
      Seed__AdminPassword: "${ADMIN_PASSWORD:-admin123}"
      # all = every vertical's demo site (evaluation); none = empty tenant for a real deployment
      Seed__Scenarios: "${SEED_SCENARIOS:-all}"
    volumes: [ "warehouse:/warehouse" ]
    ports: [ "5080:8080" ]

  # On-site reader agent (store-and-forward). Start with `docker compose --profile edge up`; set EDGE_DEVICE_TOKEN to a
  # Gateway device's provisioning token and configure readers via Edge__Readers__0__DeviceId / __Host …
  edge:
    build: { context: ./src/backend, dockerfile: Dockerfile.edge }
    profiles: [ "edge" ]
    depends_on: [ api ]
    environment:
      Edge__AgentId: "${EDGE_AGENT_ID:-edge-1}"
      Edge__Server__Url: "http://api:8080"
      Edge__Server__DeviceToken: "${EDGE_DEVICE_TOKEN:-}"
      Edge__Listen: "http://0.0.0.0:8090/"
    volumes: [ "edgequeue:/queue" ]
    ports: [ "8090:8090" ]

  web:
    build: ./src/web
    depends_on: [ api ]
    ports: [ "8080:80" ]

volumes:
  pgdata:
  warehouse:
  edgequeue:
